name: loom_communities_app_shell
description: Tab-native App Shell renderers, card-surface models, and demo catalog for the Loom Communities demo app.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  animations: ^2.0.11
  file_picker: ^12.1.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  http_parser: ^4.1.2
  loom_auth_session:
    path: ../loom_auth_session
  loom_demo_local_backend:
    path: ../loom_demo_local_backend
  loom_workflow_engine:
    path: ../loom_workflow_engine
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  loom_ux_judges:
    path: ../../tooling/loom_ux_judges

flutter:
  assets:
    - assets/Loom_Communities_Workflow_Engine_GardenClub_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_CameraClub_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_BookClub_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_ChessClub_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_YouthSoccer_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_Mosque_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_AdFreeCommunity_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_CedarCommonsHOA_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_DataPortabilityCommunity_Example.jsonc
    - assets/Loom_Communities_Workflow_Engine_MemberSocialSpace_Example.jsonc
    - assets/b25_semantic_interaction_models.json
