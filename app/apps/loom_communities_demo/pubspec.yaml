name: loom_communities_demo
description: Current Loom Communities demo app for workflow UX validation, screenshot capture, APK builds, and emulator launches.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  loom_app_shell:
    path: ../../packages/core/loom_app_shell
  loom_communities_app_shell:
    path: ../../packages/core/loom_communities_app_shell
  loom_demo_local_backend:
    path: ../../packages/core/loom_demo_local_backend
  loom_extension_package:
    path: ../../packages/core/loom_extension_package

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  loom_api_contracts:
    path: ../../packages/core/loom_api_contracts
  loom_fake_backend:
    path: ../../packages/core/loom_fake_backend
  loom_seed_data:
    path: ../../packages/core/loom_seed_data
  loom_skill_debug_harness:
    path: ../../packages/tooling/loom_skill_debug_harness

flutter:
  uses-material-design: true
