name: loom_workspace

packages:
  - apps/*
  - packages/core/*
  - packages/features/fan/*
  - packages/features/creator/*
  - packages/tooling/*

scripts:
  analyze:
    run: melos exec --concurrency=1 --fail-fast -- "flutter analyze ."
    description: Analyze every package.
  test:
    run: melos exec --concurrency=1 --fail-fast --dir-exists=test -- "flutter test"
    description: Run package tests.
  test:integration:
    run: cd apps/loom_demo && flutter test integration_test -d "${LOOM_EMULATOR:-emulator-5554}"
    description: Run Phase integration tests on the agent emulator (emulator-5554 by default; override with LOOM_EMULATOR, e.g. LOOM_EMULATOR=emulator-5560 for a manual emulator).
  lint:boundaries:
    run: dart run packages/tooling/loom_lints/bin/check_boundaries.dart
    description: Enforce feature and design-system import boundaries.
  manifest:gate:
    run: dart run packages/tooling/manifest_gate.dart
    description: Validate the V2 test manifest and component/test references.
  phase:gate:
    run: dart run packages/tooling/phase_gate.dart
    description: Validate the requested V2 phase gate.
  skill:prereq:check:
    run: dart run packages/tooling/skill_prereq_check.dart --mode local-demo
    description: Check the Skill prerequisite manifest for local-demo validation.
  skill:prereq:setup:
    run: dart run packages/tooling/skill_prereq_setup.dart --target codex --mode local-demo
    description: Print the Skill prerequisite setup plan for Codex local-demo execution.
