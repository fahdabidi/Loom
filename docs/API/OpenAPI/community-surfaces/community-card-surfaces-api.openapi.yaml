components:
  securitySchemes:
    LoomUserOAuth:
      $ref: '../_shared/security-schemes.yaml#/components/securitySchemes/LoomUserOAuth'
    LoomServiceAuth:
      $ref: '../_shared/security-schemes.yaml#/components/securitySchemes/LoomServiceAuth'
  parameters:
    CommunityId:
      name: communityId
      in: path
      required: true
      schema:
        type: string
      description: Stable Loom community identifier.
    SurfaceId:
      name: surfaceId
      in: query
      required: false
      schema:
        type: string
      description: Optional surface instance identifier for read operations.
    PersonaId:
      name: personaId
      in: query
      required: false
      schema:
        type: string
      description: Persona or role context used to filter available actions and receiver states.
  schemas:
    SurfaceFamily:
      type: string
      enum:
        - community-home
        - announcement
        - event-rsvp
        - member-meetup
        - volunteer
        - equipment-loan
        - exchange
        - nomination
        - vote
        - thread
        - payment
        - care-request
        - approval
        - operations
        - knowledge
        - portability
        - social
        - ad
        - form
        - inbox
        - external-document-link
        - documents
        - workflow-status
        - calendar
        - app-shell-navigation
    SurfaceActionRequest:
      type: object
      required:
        - actor
        - surfaceFamily
        - operation
        - payload
      properties:
        actor:
          $ref: '../_shared/components.yaml#/components/schemas/ActorPrincipal'
        surfaceFamily:
          $ref: '#/components/schemas/SurfaceFamily'
        surfaceId:
          type: string
          nullable: true
        operation:
          type: string
          description: Contract operation name from x-loom-contract-operation.
        personaId:
          type: string
          nullable: true
        roleId:
          type: string
          nullable: true
        expectedVersion:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          description: Domain payload configured by the selected card surface.
    SurfaceActionResponse:
      type: object
      required:
        - surfaceState
        - auditRef
      properties:
        surfaceState:
          $ref: '#/components/schemas/SurfaceState'
        auditRef:
          $ref: '../_shared/components.yaml#/components/schemas/ResourceRef'
        receiptRefs:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptRef'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SurfaceEvent'
    SurfaceStateResponse:
      type: object
      required:
        - surfaceState
      properties:
        surfaceState:
          $ref: '#/components/schemas/SurfaceState'
    SurfaceCollectionResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SurfaceState'
        nextPageToken:
          type: string
          nullable: true
    SurfaceState:
      type: object
      required:
        - surfaceId
        - communityId
        - extensionId
        - surfaceFamily
        - state
        - allowedActions
        - version
      properties:
        surfaceId:
          type: string
        communityId:
          type: string
        extensionId:
          type: string
        surfaceFamily:
          $ref: '#/components/schemas/SurfaceFamily'
        personaId:
          type: string
          nullable: true
        roleId:
          type: string
          nullable: true
        state:
          type: string
          description: Domain state such as draft, open, submitted, approved, paid, sent, read, failed, cancelled, or archived.
        title:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        domainObject:
          type: object
          additionalProperties: true
          description: Domain-specific card data visible to the current persona.
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/AllowedSurfaceAction'
        disabledActions:
          type: array
          items:
            $ref: '#/components/schemas/DisabledSurfaceAction'
        hiddenActions:
          type: array
          items:
            type: string
        receiverStates:
          type: array
          items:
            $ref: '#/components/schemas/ReceiverState'
        permissionDecision:
          $ref: '../_shared/components.yaml#/components/schemas/PolicyDecision'
        receiptRefs:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptRef'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SurfaceEvent'
        version:
          type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
    AllowedSurfaceAction:
      type: object
      required:
        - action
        - label
      properties:
        action:
          type: string
        label:
          type: string
        style:
          type: string
          enum:
            - primary
            - secondary
            - destructive
            - quiet
        requiresConfirmation:
          type: boolean
          default: false
    DisabledSurfaceAction:
      type: object
      required:
        - action
        - reason
      properties:
        action:
          type: string
        reason:
          type: string
        remediation:
          type: string
          nullable: true
    ReceiverState:
      type: object
      required:
        - personaId
        - state
      properties:
        personaId:
          type: string
        roleId:
          type: string
          nullable: true
        state:
          type: string
        visibleSummary:
          type: string
          nullable: true
    ReceiptRef:
      type: object
      required:
        - receiptType
        - receiptId
      properties:
        receiptType:
          type: string
          enum:
            - audit
            - payment
            - notification
            - export
            - migration
            - ad
            - consent
        receiptId:
          type: string
        resource:
          $ref: '../_shared/components.yaml#/components/schemas/ResourceRef'
    SurfaceEvent:
      type: object
      required:
        - eventType
        - eventId
        - occurredAt
      properties:
        eventType:
          type: string
          description: Typed event such as community.announcement.message.published.
        eventId:
          type: string
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
