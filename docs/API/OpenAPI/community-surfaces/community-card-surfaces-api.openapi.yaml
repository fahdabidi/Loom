openapi: 3.1.0
info:
  title: Loom Community Card Surfaces API
  version: 0.1.0
  summary: Executable API contracts for Loom Communities production card surfaces.
  description: |
    This OpenAPI specification defines every interaction required by the Loom Communities card-surface
    catalog. Generated extensions select card surfaces first, then call these Loom-owned operations via
    the runtime bridge. The operations use a common surface state/action envelope so custom communities
    can configure domain fields while Loom owns permissions, idempotency, audit, receipts, protected
    data routing, events, and export behavior.
servers:
  - url: https://community-surfaces.loom.example
    description: Loom community card-surface API boundary.
security:
  - LoomUserOAuth: []
  - LoomServiceAuth: []
x-loom-api-owner: community/card-surfaces
x-loom-downstream-apis:
  - ../ecosystem/extension-runtime-api.openapi.yaml
  - ../governance/audit-api.openapi.yaml
  - ../identity/fan-passport-api.openapi.yaml
  - ../identity/fan-vault-api.openapi.yaml
  - ../identity/fan-wallet-api.openapi.yaml
  - ../monetization/receipt-ledger-api.openapi.yaml
  - ../monetization/entitlement-ledger-api.openapi.yaml
  - ../monetization/settlement-engine-api.openapi.yaml
  - ../content/ad-decision-api.openapi.yaml
  - ../discovery/search-api.openapi.yaml
  - ../discovery/ai-gateway-api.openapi.yaml
  - ../portability/migration-export-api.openapi.yaml
tags:
  - name: Community Home Surface
    description: Community card/home interactions implemented by CommunityHomeSurfaceApi.
  - name: Announcement Surface
    description: Announcement / publish interactions implemented by CommunityAnnouncementApi.
  - name: Event RSVP Surface
    description: Event / RSVP interactions implemented by CommunityEventRsvpApi.
  - name: Member Meetup Surface
    description: Member meetup scheduling interactions implemented by CommunityMeetupApi.
  - name: Volunteer Surface
    description: Volunteer signup interactions implemented by CommunityVolunteerApi.
  - name: Equipment Loan Surface
    description: Shared item marketplace, loan, queue, custody, and giveaway interactions implemented by CommunityEquipmentLoanApi.
  - name: Plant And Item Exchange Surface
    description: Plant exchange interactions implemented by CommunityExchangeApi.
  - name: Book Nomination Surface
    description: Book nomination interactions implemented by CommunityNominationApi.
  - name: Vote And Poll Surface
    description: Vote / poll interactions implemented by CommunityVoteApi.
  - name: Discussion And Message Surface
    description: Discussion / message interactions implemented by CommunityThreadApi.
  - name: Payment Surface
    description: Payments / dues / donations / ad-off interactions implemented by CommunityPaymentSurfaceApi.
  - name: Care And Protected Request Surface
    description: Care / protected request interactions implemented by CommunityCareRequestApi.
  - name: Approval And Request Surface
    description: Approval / request cards interactions implemented by CommunityApprovalApi.
  - name: Documents Facilities And Roster Surface
    description: Documents / facilities / roster interactions implemented by CommunityOperationsSurfaceApi.
  - name: Search And AI Digest Surface
    description: Search / AI digest interactions implemented by CommunityKnowledgeSurfaceApi.
  - name: Export Import And Transfer Surface
    description: Export / import / transfer interactions implemented by CommunityPortabilitySurfaceApi.
  - name: Messaging And Connections Surface
    description: Messaging / connections interactions implemented by CommunitySocialSurfaceApi.
  - name: Ads No Fill And Ad Off Surface
    description: Ads / no-fill / ad-off interactions implemented by CommunityAdSurfaceApi.
  - name: Custom Form Surface
    description: Custom form submission interactions implemented by CommunityFormSurfaceApi.
  - name: Notification Inbox Surface
    description: Notification inbox interactions implemented by CommunityInboxSurfaceApi.
  - name: App Shell Navigation Surface
    description: Persona-aware App Shell tabs, pinning, presentation, theme, customization knobs, tab renderer contracts, and messages-tab interactions implemented by CommunityAppShellNavigationApi.
  - name: Calendar Surface
    description: Calendar, schedule, recurrence, reminder, import/export, and linked-surface interactions implemented by CommunityCalendarSurfaceApi.
  - name: Workflow Status Surface
    description: Arbitrary multi-step request/case/status interactions implemented by CommunityWorkflowStatusApi.
  - name: Documents Surface
    description: Dedicated document library, embedded/external open, access, version, and audit interactions implemented by CommunityDocumentSurfaceApi.
  - name: External Document Link Surface
    description: External document preview, embedded browser, external app launch, link, access, and audit interactions implemented by CommunityExternalDocumentApi.
