openapi: 3.1.0
info:
  title: Loom Document Library API
  version: 0.1.0
  summary: Stored bytes for the `documentLibrary` archetype, governed by the community's own workflow.
  description: >-
    Holds the files behind the `documentLibrary` archetype: a member uploads a PDF, the library keeps
    the bytes, and who may read them is decided by the community's workflow definition rather than by
    this service.


    **This is not a general file store.** Every document is bound to one workflow instance, and that
    instance is what gives it meaning and access rules. There is no way to upload a file that belongs
    to nothing -- an orphaned blob has no owner, no state, and therefore no answer to "who may read
    this", and the only safe answer to an unanswerable access question is to refuse the write.


    **Access is derived, never asserted.** A caller cannot state who may read a document. It says which
    instance the document belongs to; this service resolves the rest from the workflow definition,
    exactly as `../community-surfaces/workflow-engine-api.openapi.yaml` resolves transition guards.
    That spec's rule applies verbatim here: identity comes from the token, never from the request, and
    a client that could name its own roles has no access control at all. A client that could name its
    own reader list would be the same hole with a different shape.


    **Derivation, in full.** This mirrors the engine's own instance-visibility resolution, in its
    order, because a document that is readable by a different set than the instance it belongs to is a
    leak in one direction or a broken library in the other. A document is readable by the union of

      1. the instance's creator -- who is also the document's owner, since uploading is a transition on
         the instance;
      2. every fan listed in the instance field named by `visibility.fields.sharedWith`, which is the
         `owner_and_shared` model the `documentLibrary` archetype declares;
      3. whoever the workflow's `visibility.default` admits:
         `public` -- everyone;
         `membersOnly` -- every fan with an active membership in the community's group;
         `guarded` -- every fan whose roles satisfy the `readGuard` of the **current** state, falling
         back to the workflow-level `visibility.readGuard` when the state declares none.

    Cedar Commons HOA uses two of these three at once and is worth following: its
    `hoa-member-document` workflow defaults to `membersOnly`, so a `published` document is readable by
    every member, while `draft` and `archived` each declare a `readGuard` of `["hoa-board"]` that
    overrides the default for those states. The same workflow therefore resolves through the
    membership branch in one state and the role branch in another.

    An unset or empty shared-with list admits nobody, never everybody. Read guards fail closed: a
    document whose instance carries no identity is visible to no one rather than to everyone.


    **Resolved at access time, not frozen at upload.** Cedar Commons HOA keeps drafts readable only by
    `hoa-board` and published documents readable by every `hoa-member`. Those are two different reader
    sets for the same bytes, separated by one `publish` transition. A reader list captured when the
    file was uploaded would still say "board only" after publication -- publishing would not publish.
    So the list is recomputed on every request, and `GET /documents/{documentId}/access` exposes the
    current answer rather than a stored one.


    **Writing is a workflow action, not a file operation.** Uploading requires that the caller could
    invoke a transition whose `action` is `upload` on that instance; deleting requires `delete`.
    Neither permission is granted by this service or configured on it. Both come from
    `action` + `allowedRoleIds` in the community's JSON, derived as `../../../references/reference/permissions.md`
    describes. A community that grants only `archive` and never `delete` gets a document store where
    nothing can be destroyed, without configuring anything here.
servers:
  - url: https://communities.loom.example
security:
  - LoomUserOAuth:
      - community.workflow
  - LoomServiceAuth: []
x-loom-api-owner: community-surfaces/workflow-engine
x-loom-archetype: documentLibrary
x-loom-architecture-docs:
  - ../../../references/archetypes/document-library.md
  - ../../../references/reference/permissions.md
x-loom-upstream-apis:
  - ./workflow-engine-api.openapi.yaml
  - ../identity/app-access-api.openapi.yaml

tags:
  - name: Documents
    description: Upload, read and remove the bytes bound to a workflow instance.
  - name: Access
    description: The resolved reader and writer sets for a document.
  - name: Member state
    description: >-
      Per-member facts about a shared document — read, saved, acknowledged — and the version each
      acknowledgement was made against.

paths:
  /v1/communities/{communityId}/instances/{instanceId}/documents:
    post:
      tags:
        - Documents
      operationId: uploadDocument
      summary: Store a file against a workflow instance.
      description: >-
        Requires that the caller could invoke an `upload` transition on this instance. The check is the
        engine's own guard evaluation, not a separate permission model, so a community that never
        declares an `upload` transition has a library nobody can write to -- which is the honest
        outcome of what it declared.


        `fieldName` names the instance field this document fills, so the workflow keeps a reference
        rather than a typed-in URL. The field must be declared by the workflow definition; an unknown
        field is a 400 rather than a silently orphaned upload.


        Uploading twice with the same `Idempotency-Key` returns the first document rather than storing
        the bytes a second time.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, fieldName]
              properties:
                file:
                  type: string
                  format: binary
                  description: The bytes. Rejected with 413 above `maxUploadBytes`.
                fieldName:
                  type: string
                  description: >-
                    The instance field this document fills, e.g. `attachmentUrl`. Must be declared by
                    the workflow definition.
                  examples: [attachmentUrl]
                title:
                  type: string
                  description: Display title. Defaults to the uploaded filename.
                contentType:
                  type: string
                  description: >-
                    Overrides the part's own media type. Stored as given and echoed on download; it is
                    never used to decide whether the bytes are safe to render.
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../_shared/errors.yaml#/components/responses/Unauthorized'
        '403':
          description: >-
            The caller could not invoke an `upload` transition on this instance. Deliberately
            indistinguishable from the 403 an unreadable instance returns, so a probe cannot map which
            instances exist.
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
        '409':
          $ref: '../_shared/errors.yaml#/components/responses/Conflict'
        '413':
          description: The file exceeds `maxUploadBytes`.
    get:
      tags:
        - Documents
      operationId: listInstanceDocuments
      summary: List the documents on an instance that the caller may read.
      description: >-
        Filtered by the same derivation a single read applies, so a document the caller may not read is
        absent rather than present-and-forbidden. An empty list and a list withheld are the same
        response on purpose.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: The readable documents.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
        '401':
          $ref: '../_shared/errors.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  /v1/communities/{communityId}/documents/{documentId}:
    get:
      tags:
        - Documents
      operationId: getDocument
      summary: Read a document's metadata.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '../_shared/errors.yaml#/components/responses/Unauthorized'
        '404':
          description: >-
            No such document, or the caller may not read it. One status for both: distinguishing them
            would let an unauthorised caller enumerate document ids.
    delete:
      tags:
        - Documents
      operationId: deleteDocument
      summary: Remove a document and its bytes.
      description: >-
        Requires that the caller could invoke a `delete` transition on the instance. `delete` and
        `archive` are different actions: archiving retires a document that still exists, deleting
        removes the bytes. A community that grants only `archive` cannot reach this endpoint at all.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '../_shared/errors.yaml#/components/responses/Unauthorized'
        '403':
          description: The caller could not invoke a `delete` transition on the owning instance.
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  /v1/communities/{communityId}/documents/{documentId}/content:
    get:
      tags:
        - Documents
      operationId: downloadDocumentContent
      summary: Read the bytes.
      description: >-
        Streams the stored object. The read derivation is evaluated on this request, so a document that
        became readable a second ago is readable now and one that was archived a second ago is not.


        `Content-Disposition: attachment` is always set. These bytes were uploaded by a community
        member and are served from a Loom origin; rendering them inline would let an uploaded HTML file
        execute against that origin.


        Recording that a download happened is a workflow transition (`download`), not a side effect of
        this endpoint. This service does not mutate instance state -- a service that quietly wrote to
        the instance on read would make `downloadedFanIds` disagree with the transition log.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Always `attachment`, with the stored filename.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '../_shared/errors.yaml#/components/responses/Unauthorized'
        '404':
          description: No such document, or the caller may not read it.

  /v1/communities/{communityId}/documents/{documentId}/access:
    get:
      tags:
        - Access
      operationId: getDocumentAccess
      summary: The resolved reader and writer sets, and where each came from.
      description: >-
        The runtime answer to "who may read this", computed now from the workflow definition and the
        instance's current state. This is what the client renders as a shared-with list; it is not a
        stored field and cannot be written.


        `derivation` reports which rule admitted each fan, so a member asking "why can they see this?"
        gets an answer that names a role, an ownership, or a share, rather than an opaque list.


        Requires that the caller may read the document. Who may read a document is itself information
        about the community's membership.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The resolved access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAccess'
        '401':
          $ref: '../_shared/errors.yaml#/components/responses/Unauthorized'
        '404':
          description: No such document, or the caller may not read it.

  /v1/communities/{communityId}/documents/{documentId}/revisions:
    post:
      tags: [Documents]
      operationId: addDocumentRevision
      summary: Replace the bytes and bump the version.
      description: >-
        Requires that the caller could invoke a transition whose `action` is `upload` on the owning
        instance — the same permission that created the document.


        Stores the new bytes and increments `version` by one. The previous revision is retained and
        remains addressable, because a document people have acknowledged cannot be quietly rewritten:
        "who accepted the CC&Rs" is unanswerable if the thing they accepted no longer exists.


        **The version is the service's to assign.** A caller cannot set it. It began as a member-typed
        text field in at least one community — an author could write "v2" over "v3", or leave it
        untouched through five real edits, and nothing anywhere would disagree. A version that does not
        move when the bytes move is worse than no version, because every acknowledgement bound to it
        silently becomes a lie.


        **Bumping invalidates acknowledgements.** Every prior acknowledgement recorded against an
        earlier version stays in the record, and stops satisfying "has this member acknowledged the
        current document". That is the point: a revised policy is a policy nobody has accepted yet.
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                changeNote:
                  type: string
                  description: >-
                    What changed, for the version history a reader sees. Optional, and never a
                    substitute for the version itself.
      responses:
        '201':
          description: The revision was stored and the version incremented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          description: The caller could not invoke an `upload` transition on the owning instance.
        '404':
          description: No such document in this community.

  /v1/communities/{communityId}/documents/{documentId}/state:
    get:
      tags: [Member state]
      operationId: getDocumentMemberState
      summary: The calling member's own read, acknowledged and saved state.
      description: >-
        Returns the caller's own state and nobody else's. This is a per-member fact about a shared
        object: one document, one state per reader, and the instance has no room for N of them.


        Communities modelled this as instance data before this endpoint existed, and it failed in two
        directions. A `fanId[]` list of readers grows without bound and rides along on every read of
        the instance. A pair of fields — `unreadForA` / `unreadForB` — works for exactly two members
        and cannot generalise.
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The caller's state. Absent facts are false rather than missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMemberState'
        '403':
          description: The caller may not read this document, so it has no state for them.
        '404':
          description: No such document in this community.

    put:
      tags: [Member state]
      operationId: setDocumentMemberState
      summary: Mark read, unread, acknowledged or saved.
      description: >-
        Sets the caller's own state. A member cannot set another member's — identity comes from the
        token, never the request, exactly as it does for access resolution.


        **`acknowledged` is not a toggle.** It can be set true and never set false: an acknowledgement
        is a record that something happened at a moment, and un-acknowledging would erase evidence
        rather than change a preference. To require acknowledgement again, publish a revision — the
        version bump does it, and does it for everyone at once. Sending `acknowledged: false` is a
        `409`, not a silent no-op, because a client that believes it cleared an acknowledgement has
        a different idea of the record than the record does.


        `read` and `saved` are ordinary toggles and may be set either way.


        Acknowledging records the document's **current** `version` alongside the timestamp. That
        binding is what makes the compliance question answerable at all.
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentMemberStateUpdate'
      responses:
        '200':
          description: The caller's state after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMemberState'
        '403':
          description: The caller may not read this document.
        '404':
          description: No such document in this community.
        '409':
          description: >-
            An attempt to set `acknowledged` to false. Acknowledgements are not retractable; publish a
            revision instead.

  /v1/communities/{communityId}/documents/{documentId}/acknowledgements:
    get:
      tags: [Member state]
      operationId: listDocumentAcknowledgements
      summary: Who has acknowledged this document, and which version they saw.
      description: >-
        The compliance view: every acknowledgement on record, each carrying the version it was made
        against. Requires that the caller could invoke a transition whose `action` is `upload` or
        `grant_access` on the owning instance — the roles that administer the document, not every
        reader, since who has and has not read a policy is not public information.


        `currentVersionOnly` answers the question people actually ask — who has accepted the document
        as it stands now — while the full list preserves the history that makes it auditable.
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: currentVersionOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The acknowledgements on record.
          content:
            application/json:
              schema:
                type: object
                required: [documentId, currentVersion, acknowledgements]
                properties:
                  documentId:
                    type: string
                  currentVersion:
                    type: integer
                  acknowledgements:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentAcknowledgement'
        '403':
          description: The caller does not administer this document.
        '404':
          description: No such document in this community.

components:
  parameters:
    CommunityId:
      name: communityId
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Loom-Correlation-Id
      in: header
      required: true
      description: >-
        Required on every workflow-service route. A request without one is rejected
        `400 invalid_correlation_id` rather than assigned a generated id, so a caller cannot lose the
        thread of its own request by omitting it.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A repeated call with the same key returns the original result rather than storing a second
        copy. Two documents for one intent would each be a valid upload with nothing able to say which
        one the instance field means.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request was malformed, or its correlation id was missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No usable token was presented.
    NotFound:
      description: No such community, instance or document.
    Conflict:
      description: The request contradicts the document's current state.


  schemas:
    Document:
      type: object
      required:
        - documentId
        - communityId
        - instanceId
        - workflowType
        - fieldName
        - title
        - filename
        - contentType
        - byteSize
        - ownerFanId
        - uploadedAt
      properties:
        documentId:
          type: string
          description: Opaque. Not derived from the filename, which a member chose and may repeat.
        communityId:
          type: string
        instanceId:
          type: string
          description: The workflow instance this document belongs to, and the source of its access rules.
        workflowType:
          type: string
        fieldName:
          type: string
          description: The instance field this document fills.
          examples: [attachmentUrl]
        title:
          type: string
        filename:
          type: string
          description: >-
            As uploaded, for display and for `Content-Disposition`. Never used to build a storage path:
            a member-supplied name that reached the object key could traverse it.
        contentType:
          type: string
        byteSize:
          type: integer
          format: int64
        ownerFanId:
          type: string
          description: The fan whose upload created this document. Always a reader, whatever the state's guard says.
        uploadedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: >-
            Starts at 1 and increments on every revision. **The service assigns it; a caller cannot.**
            Cedar Commons HOA carried a member-typed `version` text field before this existed, so an
            author could write "v2" over "v3" or leave it untouched through five real edits and nothing
            would disagree. A version that does not move when the bytes move is worse than none, because
            every acknowledgement bound to it silently becomes false.
        revisedAt:
          type: string
          format: date-time
          description: When the current version was published. Equals `uploadedAt` for version 1.
        changeNote:
          type: string
          description: What changed in this revision, if the uploader said.
        contentUrl:
          type: string
          format: uri
          description: >-
            Relative URL of the content endpoint. A convenience for the client, not a capability: it
            carries no token and grants nothing on its own.

    DocumentAccess:
      type: object
      required: [documentId, instanceState, readFanIds, writeFanIds, derivation]
      properties:
        documentId:
          type: string
        instanceState:
          type: string
          description: >-
            The state the derivation was evaluated against. Included because the answer is only true
            for this state -- a `publish` changes it.
        readFanIds:
          type: array
          items:
            type: string
          description: >-
            Every fan who may read the document right now. Empty when
            `derivation.byDefault.model` is `public`, which means everyone rather than nobody -- read
            `everyone` before reading this list, or a public document looks locked.
        writeFanIds:
          type: array
          items:
            type: string
          description: >-
            Every fan who could invoke an `upload` or `delete` transition on the owning instance right
            now. Writers are not automatically readers, and are not merged into `readFanIds`: a
            community may let a role file documents it cannot read back.
        derivation:
          $ref: '#/components/schemas/DocumentAccessDerivation'

    DocumentAccessDerivation:
      type: object
      description: >-
        Why each fan is in the set, following the engine's own visibility resolution. The branches are
        not alternatives to choose between -- owner and shared-with always apply, and exactly one of
        the three `visibility.default` branches applies on top, decided by the workflow and the
        instance's current state.
      required: [byOwner, byShare, byDefault]
      properties:
        byDefault:
          type: object
          description: The branch taken by `visibility.default`, and who it admitted.
          required: [model]
          properties:
            model:
              type: string
              enum: [public, membersOnly, guarded]
            everyone:
              type: boolean
              description: Set only for `public`. Then `readFanIds` is not an enumeration and is empty.
            byMembership:
              type: array
              description: >-
                Set only for `membersOnly`: every fan with an active membership in the community's
                group, regardless of role.
              items:
                type: string
            byRole:
              type: array
              description: >-
                Set only for `guarded`: fans admitted by the effective `readGuard`, grouped by the role
                that admitted them. The guard is the current state's, or the workflow's when the state
                declares none.
              items:
                type: object
                required: [roleId, fanIds]
                properties:
                  roleId:
                    type: string
                  fanIds:
                    type: array
                    items:
                      type: string
            guardState:
              type: string
              description: >-
                Set only for `guarded`: which guard was used, `state` or `workflow`. A community
                debugging "why can the whole board see this draft" needs to know which of the two
                declarations is in force.
        byOwner:
          type: array
          description: The owner, when the guard did not already admit them. Zero or one entry.
          items:
            type: string
        byShare:
          type: object
          description: Fans admitted by the instance's shared-with field.
          required: [fieldName, fanIds]
          properties:
            fieldName:
              type: string
              description: >-
                The field named by `visibility.fields.sharedWith`. Null when the community declared no
                sharing, which is different from declaring it and sharing with nobody.
            fanIds:
              type: array
              items:
                type: string

    DocumentMemberState:
      type: object
      additionalProperties: false
      required: [documentId, fanId, read, acknowledged, saved, currentVersion]
      properties:
        documentId:
          type: string
        fanId:
          type: string
          description: The caller, taken from the token. Never accepted from the request.
        currentVersion:
          type: integer
          description: The document's version right now, so a client can compare it against the one acknowledged.
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
        saved:
          type: boolean
        savedAt:
          type: string
          format: date-time
        acknowledged:
          type: boolean
          description: >-
            Whether this member has acknowledged **any** version. On its own it does not answer the
            question worth asking — compare `acknowledgedVersion` with `currentVersion` for that.
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedVersion:
          type: integer
          description: >-
            The version that was current when they acknowledged. Less than `currentVersion` means they
            accepted an older document and the acknowledgement is stale — which is a real state, not an
            error, and the surface should say so rather than showing a tick.

    DocumentMemberStateUpdate:
      type: object
      additionalProperties: false
      description: >-
        Only the fields present are changed. Omitting a field leaves it alone rather than clearing it,
        so a client marking something read cannot accidentally unsave it.
      properties:
        read:
          type: boolean
        saved:
          type: boolean
        acknowledged:
          type: boolean
          description: >-
            May only be set `true`. Setting it `false` is a `409` — see this endpoint's description.

    DocumentAcknowledgement:
      type: object
      additionalProperties: false
      required: [fanId, version, acknowledgedAt]
      properties:
        fanId:
          type: string
        version:
          type: integer
          description: The version acknowledged, not the version now.
        acknowledgedAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: >-
            True when `version` is behind the document's current version. Computed, not stored — the
            same record becomes stale the moment a revision is published, without being rewritten.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  securitySchemes:
    LoomUserOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.loom.example/oauth2/authorize
          tokenUrl: https://auth.loom.example/oauth2/token
          scopes:
            community.workflow: Act within a community's workflows.
    LoomServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
