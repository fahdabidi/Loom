openapi: 3.1.0
info:
  title: Loom Workflow Engine API
  version: 0.1.0
  summary: Server-authoritative execution of community workflow definitions.
  description: >-
    Runs a community's state machines: which instances a viewer may read, which transitions they may
    invoke, and what happens when they do.


    **This service is the authority. The client engine is a cache and a renderer.**
    `LocalWorkflowEngineApi` stays on the device for offline rendering, but it no longer decides
    anything: every guard, read filter and effect is evaluated here. Before this service existed those
    rules ran only on the device, which made them correct for the UI and not a security boundary --
    `guards.md` had already warned that "a direct API call would bypass it".


    **The same engine runs on both sides.** This service embeds the `loom_workflow_engine` package
    rather than reimplementing it. A second implementation would have to agree with the first on every
    input of a 23-function expression language, and no test can prove that. The store is
    dialect-agnostic: SQLite on the device, PostgreSQL here.


    **Identity comes from the token, never from the request.** The caller's `fanId` is taken from the
    authenticated principal, and their roles are resolved from App Access. A client cannot name its own
    roles, because a client that could claim `hoa-board` has no access control at all. Effective
    permissions are cached briefly per `(fanId, communityId)` so guard evaluation does not make a
    network hop per transition.
servers:
  - url: https://communities.loom.example
security:
  - LoomUserOAuth:
      - community.workflow
  - LoomServiceAuth: []
x-loom-api-owner: community-surfaces/workflow-engine
x-loom-architecture-docs:
  - ../../../references/reference/permissions.md
  - ../../../references/archetypes/CONTRACTS.md
x-loom-upstream-apis:
  - ../identity/app-access-api.openapi.yaml
paths:
  /v1/communities/{communityId}/workflow-definitions:
    put:
      operationId: replaceWorkflowDefinitions
      summary: Install or replace a community's workflow definitions.
      description: >-
        Called at community install time, alongside App Access's
        `installCommunityPackage`. Definitions are replaced wholesale rather than merged: a workflow
        dropped from a package must stop existing, and merging would leave a retired state machine
        quietly executable.


        Rejects a package whose `specVersion` this service does not implement, rather than
        best-effort-parsing it. Silently ignoring a construct it does not understand is how a community
        ships a guard that never fires -- the most dangerous failure mode in this system, because a
        guard that silently does not run looks exactly like a guard that passes.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWorkflowDefinitionsRequest'
      responses:
        '200':
          description: Definitions installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionsSummary'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '403':
          $ref: '../_shared/errors.yaml#/components/responses/Forbidden'
        '422':
          description: Structurally valid but not executable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionsSummary'

  /v1/communities/{communityId}/instances:
    get:
      operationId: queryInstances
      summary: List instances the caller may read.
      description: >-
        **Read filtering happens here, not on the client.** Every returned instance has passed its
        workflow's `visibility` rule -- the state's `readGuard` if it declares one, otherwise the
        workflow's -- evaluated against the caller's `fanId` and resolved roles.


        Guards fail closed. An identity field that is unset matches nobody, so an instance belonging to
        no one is returned to no one. That is deliberate: seed data carrying no identity renders
        nothing rather than leaking.


        An instance the caller may not read is **absent**, not marked inaccessible. Returning a
        redacted stub would disclose that it exists.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - name: workflowType
          in: query
          required: false
          schema:
            type: string
        - name: sortKey
          in: query
          required: false
          description: An `instanceDataSchema` field name to sort by.
          schema:
            type: string
        - $ref: '../_shared/pagination.yaml#/components/parameters/Limit'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Readable instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResponse'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
    post:
      operationId: createInstance
      summary: Create an instance of a workflow type.
      description: >-
        Permitted only if the caller holds the archetype's `create` permission for this workflow, as
        derived by App Access from the package's `byRoleIds`.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '403':
          $ref: '../_shared/errors.yaml#/components/responses/Forbidden'

  /v1/communities/{communityId}/instances/aggregate:
    post:
      operationId: aggregate
      summary: Aggregate workflow instance values visible to the caller.
      description: >-
        Computes an aggregate over instances that pass the workflow's visibility rule for the
        authenticated caller. `filter` entries are exact-match equality constraints. Supplying
        `groupBy` returns one object per distinct group value; otherwise `result` is a scalar or null.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregateRequest'
      responses:
        '200':
          description: Aggregate result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateResponse'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'

  /v1/communities/{communityId}/instances/batch:
    post:
      operationId: createInstances
      summary: Atomically create instances of one workflow type.
      description: >-
        Permitted only if the caller holds the archetype's `create` permission for this workflow, as
        derived by App Access from the package's `byRoleIds`.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstancesRequest'
      responses:
        '201':
          description: Created in request order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowInstance'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '403':
          $ref: '../_shared/errors.yaml#/components/responses/Forbidden'

  /v1/communities/{communityId}/instances/{instanceId}/fields:
    patch:
      operationId: updateInstanceFields
      summary: Edit fields without changing workflow state.
      description: >-
        Authorization is evaluated by the workflow engine from the instance's current-state
        `editGuard`, `editableFields`, and field schema. It does not use an App Access permission.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceFieldsRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '403':
          description: >-
            The current-state edit guard or field schema refused the edit. Deliberately does not
            identify the guard clause or field that caused the refusal.
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ApiError'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  /v1/communities/{communityId}/instances/{instanceId}/available-transitions:
    get:
      operationId: availableTransitions
      summary: The transitions this caller may invoke on this instance, right now.
      description: >-
        **This is what the client renders buttons from.** It is server-computed for the same reason the
        service exists: a client deciding for itself shows buttons the server will reject, which reads
        to a member as the app being broken.


        Each entry has passed its guard for this caller and this instance's current state. A transition
        the caller cannot invoke is absent rather than returned disabled -- a disabled button still
        discloses that the action exists.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Invocable transitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableTransitionsResponse'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  /v1/communities/{communityId}/notifications/due:
    get:
      operationId: dueNotifications
      summary: The caller's reminders that have come due.
      description: >-
        **The service `deliver_reminder` has always named.**
        [`permissions.md`](../../../references/reference/permissions.md) §4 describes that action as
        platform-applied "through the `dueNotifications({asOf})` platform service", and until this
        operation existed there was no such service: a member could set a reminder and nothing would
        ever deliver it.


        Returns notification instances whose `dueAt` has passed, **scoped to the caller by the engine's
        own read model** rather than by a recipient filter of this endpoint's devising. The engine's
        local `dueNotifications` returns every instance in the community carrying a past `dueAt`, which
        is correct on a device holding one member's database and would hand every member everyone
        else's reminders if returned unchanged here. Both shipped notification workflows already
        declare a `readGuard` on their recipient field, so asking who may read each one is the same
        answer, derived rather than restated.


        **`asOf` is the caller's instant, not the server's.** A device that has been offline asks for
        everything due up to now and receives its backlog; answering from a server clock would skip
        whatever came due while the app was closed. A reminder is delivered late rather than lost.


        This operation does not mark anything delivered. Nothing in the grammar records that a
        reminder was shown -- `read` means the member read it -- so a reminder stays due once its
        instant passes, and the caller is responsible for not showing it twice.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CommunityId'
        - name: asOf
          in: query
          required: false
          description: >-
            ISO-8601 instant to evaluate against. Defaults to the server's clock, which is a
            convenience for probes rather than the intended use — a client should send its own.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Reminders due as of the given instant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DueNotificationsResponse'
        '400':
          description: >-
            `asOf` was present and not an ISO-8601 instant. Refused rather than defaulted, because a
            silently-substituted clock delivers the wrong set and looks like it worked.
        '401':
          $ref: '../_shared/errors.yaml#/components/responses/Unauthorized'

  /v1/communities/{communityId}/instances/{instanceId}/transitions:
    post:
      operationId: applyTransition
      summary: Invoke a transition.
      description: >-
        Re-evaluates the guard at execution time rather than trusting that `availableTransitions` said
        yes: the two calls are separated by network time, during which state can change. The listing is
        advice for rendering; this is the decision.


        Applies the transition's effects, including archetype-owned bookkeeping -- a per-person action
        such as `open` or `acknowledge` records the caller once, without the package declaring the
        field or writing an `actorInList` guard against it.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTransitionRequest'
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '403':
          description: >-
            The guard refused. Deliberately does not say which clause failed: a caller learning that
            they failed `actorEqualsField` rather than `allowedRoleIds` learns something about the
            instance they cannot read.
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ApiError'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
        '409':
          description: The instance is no longer in a state this transition leaves from.
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ApiError'

  /v1/communities/{communityId}/changes:
    get:
      tags: [Sync]
      operationId: listVisibleChanges
      summary: What changed for this caller since their cursor, and what they can still see.
      description: >-
        Feeds a read-only local replica. Returns the instances visible to **this caller** that changed
        since `updatedSince`, together with the complete set of instance ids the caller can currently
        see.


        **The feed is per-viewer, and that is not an implementation detail.**
        `readVisibleInstance(instanceId, fanId)` resolves visibility per fan — creator, archetype
        share, then `visibility.default` and the state's `readGuard`. There is therefore no
        community-wide answer to "what changed": two members syncing the same community at the same
        cursor legitimately receive different sets. Anything that computes this once and serves it to
        everyone is a leak.


        **Why `visibleInstanceIds` is returned rather than tombstones.** An instance can leave a
        caller's view without changing at all — someone else's transition moves it to a state whose
        `readGuard` excludes them, or their own role changes. The server cannot emit "this left your
        view" as an event, because it never recorded what your view previously was. So the response
        carries the full id set the caller can see now, and the replica deletes anything local that is
        absent from it. Ids are small; the alternative is a client that silently keeps rows it may no
        longer read.


        **A role change invalidates the cursor.** If the caller's roles differ from when the cursor was
        issued, `resyncRequired` is true and the client must discard its replica and start from no
        cursor. Instances the caller could not see before may now be visible and will not appear in a
        `updatedSince` window, because they did not change — only the caller's right to see them did. A
        replica that ignored this would be missing data it believes it has, which is worse than being
        behind.


        **`updatedSince` is inclusive, and that is deliberate.** `workflow_instances.updated_at` is a
        millisecond timestamp, so two instances written in the same millisecond are indistinguishable
        to a cursor. An exclusive bound would skip the second one permanently; an inclusive bound
        repeats the boundary instance on the next call. A replica is a keyed overwrite, so a repeat is
        idempotent and a skip is data loss. **Prefer the harmless failure.**


        This trades exactness for simplicity, and the alternative is worth naming: a monotonic
        per-community sequence would make the cursor total-ordered and avoid the repeat. It is the more
        correct design and costs a new column, a writer, and a migration. Revisit if the boundary
        repeat ever becomes measurable.
      parameters:
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - name: updatedSince
          in: query
          required: false
          description: >-
            Epoch milliseconds, **inclusive**. Omitted means a full sync of everything the caller can
            see.
          schema:
            type: integer
            format: int64
        - name: roleCursor
          in: query
          required: false
          description: >-
            The `nextRoleCursor` from the previous response, passed back unchanged.


            **Opaque, and deliberately so.** It binds a cursor to the role set the caller held when it
            was issued, which is the only way `resyncRequired` can be computed: the server cannot
            otherwise know what the caller could see then. Clients must not parse, construct or
            compare it — it exists to be handed back.


            Omitted on a first sync. **Omitted on a resumed sync is not an error**, but the response
            will set `resyncRequired` true, because a cursor with no role binding cannot be shown to
            still be valid, and assuming it is would leave a replica confidently incomplete.


            It carries no role identifiers in the clear. An earlier draft of this endpoint required
            `resyncRequired` while providing nothing to compute it from — the effect was specified and
            the mechanism was not, and an implementation refused to build it rather than invent an
            undocumented parameter.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        '200':
          description: >-
            Changes for this caller. `nextUpdatedSince` is the cursor for the following call; when
            `hasMore` is true the caller should immediately request again rather than waiting, because
            the page boundary is not a consistent point in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisibleChangePage'
        '400':
          description: Malformed cursor, or a missing correlation id.
        '403':
          description: The caller is not a member of this community.

components:
  parameters:
    CommunityId:
      name: communityId
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string

  schemas:
    ReplaceWorkflowDefinitionsRequest:
      type: object
      required: [specVersion, definitions]
      properties:
        specVersion:
          type: integer
          description: The package's `specVersion`. Rejected if this service does not implement it.
        definitions:
          type: object
          description: >-
            The package's `experience.workflowDefinitions`, verbatim. Passed to the same engine the
            client runs, so no translation step can introduce a divergence.
          additionalProperties: true

    WorkflowDefinitionsSummary:
      type: object
      required: [communityId, workflowTypes, findings]
      properties:
        communityId:
          type: string
        specVersion:
          type: integer
        workflowTypes:
          type: array
          items:
            type: string
        removedWorkflowTypes:
          type: array
          description: Types present before this call and absent from it. Their instances become unreachable.
          items:
            type: string
        findings:
          type: array
          description: Empty on success; the reasons on a 422.
          items:
            $ref: '#/components/schemas/DefinitionFinding'

    DefinitionFinding:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - unsupported_spec_version
            - unknown_card_surface_family
            - unknown_action_for_archetype
            - undeclared_role_in_guard
            - unparseable_formula
            - unknown_effect_op
        message:
          type: string
        workflowType:
          type: string
          nullable: true
        transitionId:
          type: string
          nullable: true

    CreateInstanceRequest:
      type: object
      required: [workflowType]
      properties:
        workflowType:
          type: string
        instanceData:
          type: object
          description: >-
            Seed values for this instance's declared fields. Fields the archetype owns are rejected --
            bookkeeping is maintained by the engine, never supplied by a caller.
          additionalProperties: true

    CreateInstancesRequest:
      type: object
      required: [workflowType, initialInstanceDataList]
      properties:
        workflowType:
          type: string
        initialInstanceDataList:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

    AggregateRequest:
      type: object
      required: [workflowType, column, op]
      properties:
        workflowType:
          type: string
          minLength: 1
        column:
          type: string
          minLength: 1
        op:
          type: string
          enum: [count, sum, avg, min, max, countDistinct]
        filter:
          type: object
          description: Exact-match equality constraints applied per key.
          additionalProperties: true
        groupBy:
          type: string
          minLength: 1

    AggregateResponse:
      type: object
      required: [result]
      properties:
        result: {}

    ApplyTransitionRequest:
      type: object
      required: [transitionId]
      properties:
        transitionId:
          type: string
        inputs:
          type: object
          description: Values for the transition's declared `inputs`.
          additionalProperties: true

    UpdateInstanceFieldsRequest:
      type: object
      required: [fieldUpdates]
      properties:
        fieldUpdates:
          type: object
          minProperties: 1
          additionalProperties: true

    WorkflowInstance:
      type: object
      required: [instanceId, workflowType, currentState, instanceData]
      properties:
        instanceId:
          type: string
        workflowType:
          type: string
        currentState:
          type: string
        instanceData:
          type: object
          description: >-
            Stored fields plus computed ones. Computed fields are evaluated per caller, because a
            formula may reference `$viewer`.
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time

    AvailableTransition:
      type: object
      required: [transitionId, label]
      properties:
        transitionId:
          type: string
        label:
          type: string
        action:
          type: string
          nullable: true
          description: The archetype action, when the transition declares one.
        tone:
          type: string
          nullable: true
        inputs:
          type: object
          nullable: true
          description: The transition's declared input specs, for rendering a form.
          additionalProperties: true

    DueNotificationsResponse:
      type: object
      required: [asOf, items]
      properties:
        asOf:
          type: string
          format: date-time
          description: >-
            The instant the answer was evaluated against — echoed so a client can tell whether its own
            clock was used or the server's default.
        items:
          type: array
          description: >-
            Notification instances, in the same shape every other instance is returned in. Empty is
            the ordinary answer.
          items:
            $ref: '#/components/schemas/WorkflowInstance'

    AvailableTransitionsResponse:
      type: object
      required: [instanceId, currentState, transitions]
      properties:
        instanceId:
          type: string
        currentState:
          type: string
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/AvailableTransition'

    ListInstancesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInstance'
        pageInfo:
          $ref: '../_shared/pagination.yaml#/components/schemas/PageInfo'

    VisibleChangePage:
      type: object
      additionalProperties: false
      required: [communityId, changed, visibleInstanceIds, nextUpdatedSince, nextRoleCursor, hasMore, resyncRequired]
      properties:
        communityId:
          type: string
        changed:
          type: array
          description: >-
            Instances visible to this caller whose `updatedAt` is at or after the cursor. Each carries
            its full current state, so the replica overwrites by `instanceId` and a repeated boundary
            instance is harmless.
          items:
            $ref: '#/components/schemas/WorkflowInstanceSnapshot'
        visibleInstanceIds:
          type: array
          description: >-
            Every instance id the caller can see **right now**, changed or not. The replica deletes
            any local instance absent from this list. This is how disappearance is communicated: the
            server cannot emit a "no longer visible" event because it never recorded what the caller
            could previously see.
          items:
            type: string
        nextUpdatedSince:
          type: integer
          format: int64
          description: >-
            The cursor for the next call. Equals the highest `updatedAt` in this page, and is passed
            back inclusively — see the endpoint description for why repeating a boundary instance is
            preferred to skipping one.
        nextRoleCursor:
          type: string
          description: >-
            Pass back as `roleCursor` on the next call. Opaque; do not parse it. Returned on every
            response, including one that set `resyncRequired`, so a client recovering from a resync
            has a valid cursor to continue from.
        hasMore:
          type: boolean
        resyncRequired:
          type: boolean
          description: >-
            True when the caller's roles have changed since the cursor was issued. The client must
            discard its replica and sync again with no cursor. An instance that became visible without
            changing will never appear in an `updatedSince` window, so continuing would leave the
            replica confidently incomplete.

    WorkflowInstanceSnapshot:
      type: object
      additionalProperties: false
      required: [instanceId, workflowType, currentState, instanceData, updatedAt]
      properties:
        instanceId:
          type: string
        workflowType:
          type: string
        currentState:
          type: string
        instanceData:
          type: object
          additionalProperties: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
          description: >-
            Epoch milliseconds. Already stored and maintained on every transition; this exposes it,
            which nothing previously did.
        createdByFanId:
          type: string

  securitySchemes:
    LoomUserOAuth:
      $ref: '../_shared/security-schemes.yaml#/components/securitySchemes/LoomUserOAuth'
    LoomServiceAuth:
      $ref: '../_shared/security-schemes.yaml#/components/securitySchemes/LoomServiceAuth'
