openapi: 3.1.0
info:
  title: Loom App Access API
  version: 0.1.0
  summary: Generic app registry, groups, permissions, roles, and fan access assignments.
  description: >-
    Defines the owned API surface for multi-tenant authorization on top of Fan Passport identity.
    Fan Passport answers "who is this user, and are they authenticated"; this API answers "which
    apps may they use, which groups are they in, which roles do they hold there, and what may those
    roles do". The model is deliberately app-agnostic: an app (for example `loom_communities`)
    registers its own permission catalog, defines groups (one per community), defines roles that map
    to permissions, and assigns fans to apps, groups, and roles. Loom Communities is the first
    consumer but no Loom-Communities concept appears in this contract.
servers:
  - url: https://identity.loom.example
security:
  - LoomUserOAuth:
      - app.access
  - LoomServiceAuth: []
x-loom-api-owner: identity/app-access
x-loom-architecture-docs:
  - ../../../Architecture/03-identity-fan-data-wallets-and-fan-app-shell.md
x-loom-downstream-apis:
  - ./fan-passport-api.openapi.yaml
  - ../governance/audit-api.openapi.yaml
paths:

  # ── Apps ────────────────────────────────────────────────────────────────
  /v1/apps:
    get:
      operationId: listApps
      summary: List registered apps.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Limit'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Registered apps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppsResponse'
    post:
      operationId: registerApp
      summary: Register an app that will own a permission catalog and groups.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAppRequest'
      responses:
        '201':
          description: App registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '409':
          $ref: '../_shared/errors.yaml#/components/responses/Conflict'

  /v1/apps/{appId}:
    get:
      operationId: getApp
      summary: Read one app.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: App.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  # ── Permission catalog (the "permissions builder") ──────────────────────
  /v1/apps/{appId}/permissions:
    get:
      operationId: listPermissions
      summary: List an app's declared permission catalog.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter to one catalog category, for example an archetype name.
      responses:
        '200':
          description: Permission catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPermissionsResponse'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
    put:
      operationId: replacePermissionCatalog
      summary: Replace an app's entire permission catalog in one call.
      description: >-
        The bulk catalog builder. An app publishes its full permission set — for Loom Communities,
        every archetype action — as a single versioned document. Replacing the catalog never
        implicitly revokes role grants; permissions removed from the catalog are reported in
        `orphanedRoleGrants` so the caller can reconcile them deliberately.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePermissionCatalogRequest'
      responses:
        '200':
          description: Catalog replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCatalog'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  # ── Groups ──────────────────────────────────────────────────────────────
  /v1/apps/{appId}/groups:
    get:
      operationId: listGroups
      summary: List an app's groups.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Limit'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupsResponse'
    post:
      operationId: createGroup
      summary: Create a group inside an app.
      description: >-
        A group is the app's own tenancy unit. Loom Communities creates one group per community,
        for example `loom_communities_cedar_commons_hoa`.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '409':
          $ref: '../_shared/errors.yaml#/components/responses/Conflict'

  /v1/apps/{appId}/groups/{groupId}:
    get:
      operationId: getGroup
      summary: Read one group.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  # ── Roles, and role → permission mapping ────────────────────────────────
  /v1/apps/{appId}/roles:
    get:
      operationId: listRoles
      summary: List roles, optionally scoped to one group.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - name: groupId
          in: query
          required: false
          schema:
            type: string
          description: >-
            Return roles bound to this group. Omit to list every role in the app, including
            app-level template roles that carry no `groupId`.
        - $ref: '../_shared/pagination.yaml#/components/parameters/Limit'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRolesResponse'
    post:
      operationId: createRole
      summary: Create a role and map it to permissions.
      description: >-
        A role with `groupId` set belongs to that group — the group-to-roles mapping, for example
        `cedar_commons_hoa_admin` in `loom_communities_cedar_commons_hoa`. A role with `groupId`
        null is an app-level template assignable in any group of that app.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '409':
          $ref: '../_shared/errors.yaml#/components/responses/Conflict'

  /v1/apps/{appId}/roles/{roleId}:
    get:
      operationId: getRole
      summary: Read one role and its permissions.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  /v1/apps/{appId}/roles/{roleId}/permissions:
    put:
      operationId: setRolePermissions
      summary: Replace the permission set a role grants.
      description: >-
        The role-to-permissions mapping tool. Every `permissionId` must already exist in the app's
        catalog; unknown ids are rejected rather than silently created.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsRequest'
      responses:
        '200':
          description: Role permissions replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  # ── Fan → app access ────────────────────────────────────────────────────
  /v1/apps/{appId}/access/{fanId}:
    get:
      operationId: getAppAccess
      summary: Read one fan's access to an app.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FanId'
      responses:
        '200':
          description: App access record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAccess'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
    put:
      operationId: setAppAccess
      summary: Grant or update a fan's access to an app, with app-level roles.
      description: >-
        The fan-to-app mapping tool, for example "this fan has access to `loom_communities` as
        `platform_admin`". App-level roles apply across every group in the app; group-scoped roles
        are assigned through group membership instead.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppAccessRequest'
      responses:
        '200':
          description: App access granted or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAccess'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
    delete:
      operationId: revokeAppAccess
      summary: Revoke a fan's access to an app.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FanId'
      responses:
        '204':
          description: Access revoked.
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  /v1/fans/{fanId}/apps:
    get:
      operationId: listFanApps
      summary: List every app one fan has access to.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FanId'
      responses:
        '200':
          description: App access records for this fan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppAccessResponse'

  # ── Fan → group membership (carries group-scoped roles) ─────────────────
  /v1/apps/{appId}/groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      summary: List a group's members and their roles.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/GroupId'
        - name: state
          in: query
          required: false
          description: >-
            Filter by membership state. `state=requested` is the pending-approvals queue an admin works
            from; omitting it returns every membership regardless of state.
          schema:
            $ref: '#/components/schemas/AssignmentState'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Limit'
        - $ref: '../_shared/pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Group members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupMembershipsResponse'

  /v1/apps/{appId}/groups/{groupId}/membership-requests:
    post:
      operationId: requestGroupMembership
      summary: Ask to join a group.
      description: >-
        Called by the signed-in fan for themselves, so the fan is taken from the token rather than the
        path -- a fan cannot file a request on someone else's behalf. Creates the membership in
        `requested`, which grants nothing until an admin approves it.


        Idempotent: requesting again while a request is already pending returns the existing one rather
        than queueing a duplicate for the admin to wade through.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestGroupMembershipRequest'
      responses:
        '200':
          description: A request was already pending; it is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembership'
        '201':
          description: Request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembership'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
        '409':
          description: The fan is already an active member of this group.
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ApiError'

  /v1/apps/{appId}/groups/{groupId}/membership-requests/{fanId}/decision:
    post:
      operationId: decideGroupMembership
      summary: Approve or reject a pending membership request.
      description: >-
        Requires `app.access.admin`. Approving moves the membership to `active` and grants the roles
        supplied here; rejecting moves it to `rejected` and grants nothing.


        Deciding a request that is not `requested` is a conflict rather than a no-op, so two admins
        acting on the same queue entry do not silently overwrite each other's decision.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/FanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideGroupMembershipRequest'
      responses:
        '200':
          description: Decision applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembership'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
        '409':
          description: This membership is not in `requested`, so there is nothing to decide.
          content:
            application/json:
              schema:
                $ref: '../_shared/errors.yaml#/components/schemas/ApiError'

  /v1/apps/{appId}/groups/{groupId}/members/{fanId}:
    get:
      operationId: getGroupMembership
      summary: Read one fan's membership in a group.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/FanId'
      responses:
        '200':
          description: Group membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembership'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
    put:
      operationId: setGroupMembership
      summary: Add a fan to a group, or update the roles they hold there.
      description: >-
        The fan-to-group mapping tool, and the group-scoped role assignment in the same record —
        "this fan is in `loom_communities_cedar_commons_hoa`, holding `cedar_commons_hoa_admin`".
        Every `roleId` must be either a role bound to this group or an app-level template role.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/FanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGroupMembershipRequest'
      responses:
        '200':
          description: Membership created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMembership'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
    delete:
      operationId: removeGroupMember
      summary: Remove a fan from a group.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/FanId'
      responses:
        '204':
          description: Membership removed.
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

  /v1/fans/{fanId}/groups:
    get:
      operationId: listFanGroups
      summary: List every group one fan belongs to, across apps.
      description: >-
        Backs cross-app and cross-community surfaces — for example a unified Messages tab that must
        span every community the fan is a member of.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FanId'
        - name: appId
          in: query
          required: false
          schema:
            type: string
          description: Restrict to one app.
      responses:
        '200':
          description: Group memberships for this fan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupMembershipsResponse'

  # ── Runtime authorization ───────────────────────────────────────────────
  /v1/apps/{appId}/community-installations:
    post:
      operationId: installCommunityPackage
      summary: Derive and register a community's group, roles, and permission grants from its package.
      description: >-
        The provisioning step that turns a community package into access control. The caller submits the
        package's derivation inputs; the service creates the community's group, registers each declared
        role, ensures the permission catalog contains every permission the package's actions imply, and
        sets each role's grants.


        **Derivation runs here, not in the client.** The rules -- archetype resolution, the closed action
        vocabularies, the structural rules for generic archetypes -- are defined in
        `docs/references/reference/permissions.md` and shared with the community-package validator as a
        generated vocabulary artifact, so the two cannot drift apart.


        **Idempotent by construction.** Re-installing the same package produces exactly the same grants:
        roles and permissions are reconciled to the submitted set rather than appended to. A role that
        disappears from a package is reported in `removedRoleIds` and its grants are withdrawn, because
        leaving a retired role holding live permissions is how stale access accumulates.


        The platform `admin` role is provisioned automatically and is never declared in a package -- see
        `permissions.md` §7.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '../_shared/components.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallCommunityPackageRequest'
      responses:
        '200':
          description: Installation reconciled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityInstallationResult'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'
        '422':
          description: >-
            The package is structurally valid but not derivable -- an action outside its archetype's
            closed vocabulary, a guard naming an undeclared role, or an ambiguous archetype.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityInstallationResult'

  /v1/access-decisions:
    post:
      operationId: checkAccess
      summary: Decide whether a fan holds a permission, optionally within a group.
      description: >-
        The runtime authorization call. Resolves app-level roles and group-scoped roles together and
        returns a shared `PolicyDecision`, including the roles that produced the outcome so a denial
        is explainable rather than opaque.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessDecisionRequest'
      responses:
        '200':
          description: Access decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
        '400':
          $ref: '../_shared/errors.yaml#/components/responses/BadRequest'

  /v1/apps/{appId}/effective-permissions/{fanId}:
    get:
      operationId: getEffectivePermissions
      summary: Resolve every permission a fan effectively holds.
      description: >-
        Returns the full resolved permission set in one call so a client can render an entire
        surface without issuing one decision request per control.
      parameters:
        - $ref: '../_shared/components.yaml#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FanId'
        - name: groupId
          in: query
          required: false
          schema:
            type: string
          description: Resolve within this group. Omit for app-level permissions only.
      responses:
        '200':
          description: Effective permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissions'
        '404':
          $ref: '../_shared/errors.yaml#/components/responses/NotFound'

components:

  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
      description: Registered app id, for example `loom_communities`.
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
      description: Group id, for example `loom_communities_cedar_commons_hoa`.
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      description: Role id, for example `cedar_commons_hoa_admin`.
    FanId:
      name: fanId
      in: path
      required: true
      schema:
        type: string
      description: Fan Passport `fanId` — the identity subject of every assignment in this API.

  schemas:

    App:
      type: object
      required: [appId, displayName, status, createdAt]
      properties:
        appId:
          type: string
          description: Stable app id, for example `loom_communities`.
        displayName:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/AppStatus'
        permissionCatalogVersion:
          type: [string, 'null']
          description: Version of the currently published permission catalog.
        createdAt:
          type: string
          format: date-time

    AppStatus:
      type: string
      enum: [active, suspended, retired]

    RegisterAppRequest:
      type: object
      required: [appId, displayName]
      properties:
        appId:
          type: string
        displayName:
          type: string
        description:
          type: [string, 'null']

    ListAppsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
        pageInfo:
          $ref: '../_shared/pagination.yaml#/components/schemas/PageInfo'

    Permission:
      type: object
      required: [permissionId, displayName]
      properties:
        permissionId:
          type: string
          description: App-unique permission id, for example `create_events`.
        displayName:
          type: string
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: >-
            Optional grouping for catalog organization — Loom Communities uses the archetype name,
            for example `event-rsvp` or `documentLibrary`.

    PermissionCatalog:
      type: object
      required: [appId, catalogVersion, permissions, publishedAt]
      properties:
        appId:
          type: string
        catalogVersion:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        orphanedRoleGrants:
          type: array
          description: >-
            Role grants that referenced a permission no longer present in the catalog. Reported, not
            auto-revoked, so removal is always a deliberate act.
          items:
            $ref: '#/components/schemas/OrphanedRoleGrant'
        publishedAt:
          type: string
          format: date-time

    OrphanedRoleGrant:
      type: object
      required: [roleId, permissionId]
      properties:
        roleId:
          type: string
        permissionId:
          type: string

    ReplacePermissionCatalogRequest:
      type: object
      required: [catalogVersion, permissions]
      properties:
        catalogVersion:
          type: string
          description: Caller-supplied version for the catalog being published.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    ListPermissionsResponse:
      type: object
      required: [appId, items]
      properties:
        appId:
          type: string
        catalogVersion:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Group:
      type: object
      required: [appId, groupId, displayName, createdAt]
      properties:
        appId:
          type: string
        groupId:
          type: string
        displayName:
          type: string
        parentGroupId:
          type: [string, 'null']
          description: Optional parent for nested group hierarchies.
        externalRef:
          $ref: '../_shared/components.yaml#/components/schemas/ResourceRef'
        createdAt:
          type: string
          format: date-time

    CreateGroupRequest:
      type: object
      required: [groupId, displayName]
      properties:
        groupId:
          type: string
        displayName:
          type: string
        parentGroupId:
          type: [string, 'null']
        externalRef:
          $ref: '../_shared/components.yaml#/components/schemas/ResourceRef'

    ListGroupsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        pageInfo:
          $ref: '../_shared/pagination.yaml#/components/schemas/PageInfo'

    Role:
      type: object
      required: [appId, roleId, displayName, permissionIds]
      properties:
        appId:
          type: string
        roleId:
          type: string
        groupId:
          type: [string, 'null']
          description: >-
            The group this role belongs to. Null means an app-level template role, assignable in any
            group of this app.
        displayName:
          type: string
        description:
          type: [string, 'null']
        permissionIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required: [roleId, displayName]
      properties:
        roleId:
          type: string
        groupId:
          type: [string, 'null']
        displayName:
          type: string
        description:
          type: [string, 'null']
        permissionIds:
          type: array
          items:
            type: string

    SetRolePermissionsRequest:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          items:
            type: string

    ListRolesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        pageInfo:
          $ref: '../_shared/pagination.yaml#/components/schemas/PageInfo'

    AssignmentState:
      type: string
      description: >-
        `requested` is a membership a fan has asked for but an admin has not yet decided on. It is
        deliberately a state on the membership row rather than a separate request entity: the alternative
        duplicates fan, group, and requested-roles into a parallel table that then has to be kept in step
        with the membership it becomes. A `requested` row grants nothing -- only `active` does -- so an
        undecided request is inert rather than partially privileged.


        `rejected` is kept rather than deleted so a repeat request is visible as a repeat, and so an
        admin can see that a decision was made.
      enum: [requested, active, suspended, revoked, rejected]

    AppAccess:
      type: object
      required: [appId, fanId, roleIds, state, grantedAt]
      properties:
        appId:
          type: string
        fanId:
          type: string
        roleIds:
          type: array
          description: App-level roles, applying across every group in this app.
          items:
            type: string
        state:
          $ref: '#/components/schemas/AssignmentState'
        grantedAt:
          type: string
          format: date-time

    SetAppAccessRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items:
            type: string
        state:
          $ref: '#/components/schemas/AssignmentState'

    ListAppAccessResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppAccess'

    GroupMembership:
      type: object
      required: [appId, groupId, fanId, roleIds, state, joinedAt]
      properties:
        appId:
          type: string
        groupId:
          type: string
        fanId:
          type: string
        roleIds:
          type: array
          description: Roles this fan holds within this group.
          items:
            type: string
        state:
          $ref: '#/components/schemas/AssignmentState'
        joinedAt:
          type: string
          format: date-time
        requestedAt:
          type: string
          format: date-time
          nullable: true
          description: When the fan asked to join. Null for memberships an admin created directly.
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decidedByFanId:
          type: string
          nullable: true
          description: The admin who approved or rejected. Null while still `requested`.
        requestNote:
          type: string
          nullable: true
          description: >-
            Optional free text from the fan with their request. Never rendered as anything but plain
            text, and never used in a decision automatically.

    SetGroupMembershipRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items:
            type: string
        state:
          $ref: '#/components/schemas/AssignmentState'

    InstallCommunityPackageRequest:
      type: object
      description: >-
        The derivation inputs extracted from one community package. This is deliberately not the whole
        package: App Access has no business parsing render bindings, theming, or seed instance data, and
        accepting them would make it a second consumer of the full grammar.
      required: [communityHandle, grammarVersion, roles, workflows]
      properties:
        communityHandle:
          type: string
          description: Becomes the group id, as `loom_communities_<communityHandle>`.
        displayName:
          type: string
        grammarVersion:
          type: integer
          description: >-
            The package's `experience.workflowGrammarVersion`. Rejected if the service does not
            implement that version's identity model, rather than guessed at.
        roles:
          type: array
          description: The package's declared `roles[]`. Each becomes a group-scoped role.
          items:
            $ref: '#/components/schemas/DerivedRoleInput'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/DerivedWorkflowInput'

    DerivedRoleInput:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
        label:
          type: string

    DerivedWorkflowInput:
      type: object
      description: One workflow, reduced to what derivation actually needs.
      required: [workflowType, cardSurfaceFamily, transitions]
      properties:
        workflowType:
          type: string
        cardSurfaceFamily:
          type: string
          description: >-
            The archetype resolved by the caller per `permissions.md` §6 step 3, including
            `responseTable` inheritance. Null when the workflow derives nothing.
          nullable: true
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/DerivedTransitionInput'
        createRoleIds:
          type: array
          description: Union of `byRoleIds` across this workflow's create actions.
          items:
            type: string

    DerivedTransitionInput:
      type: object
      required: [transitionId, allowedRoleIds]
      properties:
        transitionId:
          type: string
        action:
          type: string
          nullable: true
          description: >-
            Declared for bespoke archetypes, absent for generic ones. Where absent, the service applies
            the structural rule using `tone` and `isTerminal`.
        tone:
          type: string
          nullable: true
        isTerminal:
          type: boolean
          nullable: true
          description: Whether this transition's target state is terminal.
        allowedRoleIds:
          type: array
          description: >-
            From `guard.allowedRoleIds`. An empty list means the transition is gated per-instance by the
            workflow engine instead, and derives no role grant -- that is expected, not an error.
          items:
            type: string

    CommunityInstallationResult:
      type: object
      required: [appId, groupId, rolesRegistered, permissionsGranted, findings]
      properties:
        appId:
          type: string
        groupId:
          type: string
        rolesRegistered:
          type: array
          items:
            type: string
        removedRoleIds:
          type: array
          description: Roles previously registered for this community that the package no longer declares.
          items:
            type: string
        permissionsGranted:
          type: integer
          description: Total role-to-permission grants after reconciliation.
        rolesWithNoPermissions:
          type: array
          description: >-
            Registered roles that ended up granting nothing. Not fatal, but almost always an authoring
            mistake -- a role nobody can act as.
          items:
            type: string
        findings:
          type: array
          description: Empty on success. Populated with the reasons on a 422.
          items:
            $ref: '#/components/schemas/DerivationFinding'

    DerivationFinding:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - unknown_action_for_archetype
            - missing_action_on_bespoke_transition
            - action_on_generic_transition
            - undeclared_role_in_guard
            - ambiguous_archetype
            - unsupported_grammar_version
        message:
          type: string
        workflowType:
          type: string
          nullable: true
        transitionId:
          type: string
          nullable: true

    RequestGroupMembershipRequest:
      type: object
      description: >-
        A fan asking to join a group. Deliberately carries no `roleIds`: what a joiner may become is the
        admin's decision, not the requester's. Roles are supplied on approval.
      properties:
        requestNote:
          type: string

    DecideGroupMembershipRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        roleIds:
          type: array
          description: >-
            Roles to grant on approval. Required when approving -- a member with no role can do nothing,
            so approving without one is almost always a mistake rather than a deliberate choice.
          items:
            type: string

    ListGroupMembershipsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupMembership'
        pageInfo:
          $ref: '../_shared/pagination.yaml#/components/schemas/PageInfo'

    AccessDecisionRequest:
      type: object
      required: [fanId, appId, permissionId]
      properties:
        fanId:
          type: string
        appId:
          type: string
        permissionId:
          type: string
        groupId:
          type: [string, 'null']
          description: Evaluate within this group. Omit to evaluate app-level roles only.

    AccessDecision:
      type: object
      required: [fanId, appId, permissionId, allowed, policy]
      properties:
        fanId:
          type: string
        appId:
          type: string
        groupId:
          type: [string, 'null']
        permissionId:
          type: string
        allowed:
          type: boolean
        grantingRoleIds:
          type: array
          description: Roles that granted the permission. Empty when `allowed` is false.
          items:
            type: string
        policy:
          $ref: '../_shared/components.yaml#/components/schemas/PolicyDecision'

    EffectivePermissions:
      type: object
      required: [fanId, appId, permissionIds, roleIds]
      properties:
        fanId:
          type: string
        appId:
          type: string
        groupId:
          type: [string, 'null']
        permissionIds:
          type: array
          description: Union of every permission granted by the fan's app-level and group-scoped roles.
          items:
            type: string
        roleIds:
          type: array
          items:
            type: string
        catalogVersion:
          type: [string, 'null']
        resolvedAt:
          type: string
          format: date-time
